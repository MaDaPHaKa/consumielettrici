<h1 class="pt-3 pl-4">Anni Bolletta</h1>
<div class="columns is-multiline is-centered">
  <div class="column is-full table-container">
    <button mat-raised-button color="primary" (click)="nuovoAnno()">
      Nuovo Anno
    </button>
  </div>
  <div class="column is-full table-container">
    <section class="overflow-table-container">
      <table
        mat-table
        [dataSource]="dataSource"
        class="mat-elevation-z8"
        multiTemplateDataRows
      >
        <ng-container matColumnDef="anno">
          <th mat-header-cell *matHeaderCellDef>Anno</th>
          <td mat-cell *matCellDef="let element">{{ element.anno }}</td>
        </ng-container>
        <ng-container matColumnDef="data">
          <th mat-header-cell *matHeaderCellDef>Data Reset</th>
          <td mat-cell *matCellDef="let element">
            {{ element.dateBaseLine | date }}
          </td>
        </ng-container>
        <ng-container matColumnDef="lastBaseline">
          <th mat-header-cell *matHeaderCellDef>Lettura Base (kWh)</th>
          <td mat-cell *matCellDef="let element">
            {{ element.lastBaseline }}
          </td>
        </ng-container>
        <ng-container matColumnDef="note">
          <th mat-header-cell *matHeaderCellDef>Note</th>
          <td mat-cell *matCellDef="let element">{{ element.note }}</td>
        </ng-container>
        <ng-container matColumnDef="azioni">
          <th mat-header-cell *matHeaderCellDef>Azioni</th>
          <td mat-cell *matCellDef="let element">
            <button mat-button (click)="modifica(element)">Modifica</button>
            <button mat-button (click)="elimina(element)">Elimina</button>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
        ></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </section>
  </div>
</div>
