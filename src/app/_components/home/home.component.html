<div class="columns is-multiline pt-3 is-centered home">
  <div class="column is-full p-2 table-container stats">
    <mat-label class="is-size-5">Somma: {{ somma }}</mat-label>
    <mat-label class="is-size-5">Media: {{ media }}</mat-label>
    <mat-label class="is-size-5">Min: {{ min }}</mat-label>
    <mat-label class="is-size-5">Max: {{ max }}</mat-label>
  </div>
  <div class="column is-full p-2 table-container">
    <app-letture-filter class="filter-full" (cercaEvent)="cerca($event)"></app-letture-filter>
  </div>
  <div class="column is-full pt-2 table-container">
    <section class="overflow-table-container">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" multiTemplateDataRows>
        <ng-container matColumnDef="data">
          <th mat-header-cell *matHeaderCellDef>Data</th>
          <td mat-cell *matCellDef="let element">
            {{ element.giorno | date }}
          </td>
        </ng-container>
        <ng-container matColumnDef="giorno">
          <th mat-header-cell *matHeaderCellDef>Giorno</th>
          <td mat-cell *matCellDef="let element">
            {{ element.giorno | giornoSettimana }}
          </td>
        </ng-container>
        <ng-container matColumnDef="consumo">
          <th mat-header-cell *matHeaderCellDef>Consumo</th>
          <td mat-cell *matCellDef="let element">
            {{ element.consumo > 0 ? element.consumo : "" }}
          </td>
        </ng-container>
        <ng-container matColumnDef="elettrodomestici">
          <th mat-header-cell *matHeaderCellDef>Elettrodomestici</th>
          <td mat-cell *matCellDef="let element">
            @for (el of element.elettrodomestici; track el.id) {
            <app-uso-elettrodomestico [uso]="el" [nascondiPulsanti]="true"></app-uso-elettrodomestico>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </section>
  </div>
</div>
